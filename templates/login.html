{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
    <section class="page-heading narrow">
        <p class="eyebrow">Службовий доступ</p>
        <h1>Вхід до кабінету</h1>
        <p class="lead">Адміністратор формує розклад, а викладачі коментують свої пари.</p>
    </section>
    <form class="card form-card login-form" method="post">
        <label>
            Email<input type="email" name="email" required>
        </label>
        <label>
            Пароль<input type="password" name="password" required>
        </label>
        <button class="button" type="submit">Увійти</button>
        <p class="muted">Демоадмін: admin@vofknuht.local / admin123</p>
    </form>
{% endblock %}
